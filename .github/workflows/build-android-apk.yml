name: Build ZX Stream Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed ZX Stream HTTPS URL"
        required: false
        default: "https://zx-stream.onrender.com"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate deployment URL
        env:
          APP_URL: ${{ inputs.app_url || 'https://zx-stream.onrender.com' }}
        run: |
          node -e "const u=new URL(process.env.APP_URL); if(u.protocol!=='https:') process.exit(1);"

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Add Capacitor Android wrapper
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          bun add @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.zxstream.app',
            appName: 'ZX Stream',
            webDir: 'dist',
            server: {
              url: process.env.APP_URL,
              cleartext: false
            }
          };
          export default config;
          EOF
          bunx cap add android
          bunx cap sync android

      - name: Generate Android launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${spec%%:*}
            size=${spec##*:}
            convert -background none public/zx-stream-icon.svg -resize ${size}x${size} android/app/src/main/res/mipmap-${density}/ic_launcher.png
            cp android/app/src/main/res/mipmap-${density}/ic_launcher.png android/app/src/main/res/mipmap-${density}/ic_launcher_round.png
          done
          cat > android/app/src/main/res/values/zx_stream_colors.xml <<'EOF'
          <resources><color name="zx_splash_background">#090612</color></resources>
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZX-Stream-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
